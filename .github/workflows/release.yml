name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      UPDATE_REPO: kd0427/kd-mttd
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # app/build.gradle.kts 의 ndkVersion 과 src/main/jni/CMakeLists.txt 의
      # cmake_minimum_required 에 맞춘다. 러너 이미지에 미리 깔린 NDK 는 버전이 달라서
      # 이 단계를 빼면 :app:configureCMakeRelease 에서 실패한다.
      - name: Install NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `|| true` 는 이 줄에만 붙인다. 워크플로 셸이 `-o pipefail` 이라, sdkmanager 가
          # 먼저 끝나면서 yes 가 broken pipe 로 죽으면 라이선스를 실제로 다 수락했는데도
          # 파이프라인이 실패로 잡힌다. 라이선스가 정말 안 먹었다면 바로 아래 설치가 실패하므로
          # 오류를 삼키는 게 아니다.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Restore signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PupdateRepo="$UPDATE_REPO"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
