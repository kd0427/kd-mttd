name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      UPDATE_REPO: kd0427/kd-mttd
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # app/build.gradle.kts 의 ndkVersion 과 src/main/jni/CMakeLists.txt 의
      # cmake_minimum_required 에 맞춘다. 러너 이미지에 미리 깔린 NDK 는 버전이 달라서
      # 이 단계를 빼면 :app:configureCMakeRelease 에서 실패한다.
      - name: Install NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `|| true` 는 이 줄에만 붙인다. 워크플로 셸이 `-o pipefail` 이라, sdkmanager 가
          # 먼저 끝나면서 yes 가 broken pipe 로 죽으면 라이선스를 실제로 다 수락했는데도
          # 파이프라인이 실패로 잡힌다. 라이선스가 정말 안 먹었다면 바로 아래 설치가 실패하므로
          # 오류를 삼키는 게 아니다.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Restore signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PupdateRepo="$UPDATE_REPO"

      # 앱의 업데이트 카드가 릴리스 본문을 그대로 보여준다. 자동 생성 변경로그만 있으면
      # 카드에 compare 링크 한 줄만 떠서 뭐가 바뀌었는지 알 수 없으므로, 저장소에 적어 둔
      # 사용자용 설명을 본문 앞에 넣는다 (자동 변경로그는 그 뒤에 붙는다 — 확인함).
      #
      # 섹션이 없으면 릴리스를 막지 않고 예전처럼 자동 변경로그만 나간다. 대신 조용히
      # 넘어가지 않게 로그에 남긴다.
      - name: Extract release notes for this tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "::warning::RELEASE_NOTES.md 가 없다 — 자동 변경로그만 나간다"
            exit 0
          fi
          # `# <버전>` 부터 다음 `# ` 직전까지.
          awk -v v="# $VERSION" '
            $0 == v { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' RELEASE_NOTES.md > release-body.md
          if [ ! -s release-body.md ]; then
            rm -f release-body.md
            echo "::warning::RELEASE_NOTES.md 에 '# $VERSION' 섹션이 없다 — 자동 변경로그만 나간다"
            exit 0
          fi
          echo "release notes for $VERSION:"
          cat release-body.md
          echo "RELEASE_BODY_PATH=release-body.md" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: app/build/outputs/apk/release/*.apk
